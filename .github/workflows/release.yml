name: '🚀 release'

on:
  push:
    branches: ['main']

concurrency: ${{ github.workflow }}-${{ github.ref }}

env:
  # The Linux system libraries the Rust side links against. Defined once because two
  # steps consume it — the cache and the apt-get that guarantees it — and a list that
  # drifts between them reintroduces exactly the failure they exist to prevent.
  APT_PACKAGES: >-
    pkg-config libgtk-3-dev libayatana-appindicator3-dev libsoup-3.0-dev
    libjavascriptcoregtk-4.1-dev libwebkit2gtk-4.1-dev librsvg2-dev
    libcairo2-dev libpango1.0-dev libharfbuzz-dev libatk1.0-dev
    libgdk-pixbuf-2.0-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
    gstreamer1.0-plugins-base gstreamer1.0-plugins-good patchelf
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

jobs:
  changesets:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.detect.outputs.should_publish }}
      release_tag: ${{ steps.detect.outputs.release_tag }}
      release_version: ${{ steps.detect.outputs.release_version }}
      release_package: ${{ steps.detect.outputs.release_package }}

    steps:
      - name: '☁️ checkout repository'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: '🛠️ setup pnpm'
        uses: pnpm/action-setup@v6

      - name: '🔧 setup node'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: '📦 install pnpm packages'
        run: pnpm install --frozen-lockfile

      - name: '� create version PR or publish tag'
        uses: changesets/action@v2.1.0
        with:
          # v2 renamed every input to kebab-case and dropped the `GITHUB_TOKEN`
          # environment variable as a way to authenticate, so the token is passed
          # explicitly rather than inherited from the `env:` block above.
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pr-title: 'chore: version package'
          commit-message: 'chore: version package'
          version-script: node .github/changeset-version.cjs
          publish-script: node .github/changeset-tag.cjs
          # v2 also creates GitHub releases and pushes git tags for whatever it detects
          # in the publish script's output, both defaulting to true. Neither is this
          # repository's job: `changeset-tag.cjs` cuts and pushes the tag itself, and the
          # release belongs to `tauri-action`, which creates it from that tag with the
          # signed updater artifacts attached. An empty release cut here would become the
          # latest-release pointer every installed application polls — so both are turned
          # off explicitly rather than left to a default that has already moved once.
          create-github-releases: false
          push-git-tags: false

      - name: '🔎 detect latest tag needing artifacts'
        id: detect
        uses: actions/github-script@v9
        with:
          script: |
            const { execSync } = require('node:child_process');

            // The desktop package's own tag namespace. `changeset-tag.cjs` cuts
            // `<name>@<version>`, so this is the desktop half of a workspace that may one day
            // tag more than one package — the glob is what keeps the two from being taken for
            // each other. `-version:refname` stays a true version sort with the prefix in
            // place, so 0.10.1 ranks above 0.9.0 rather than below it.
            //
            // The pre-workspace `v*.*.*` tags are deliberately not matched, and deliberately
            // not deleted: the five published releases still point at them. They can never be
            // newest again, because the first tag cut under this scheme supersedes them by
            // date — which is the only ordering the updater consults.
            const PACKAGE_TAG_GLOB = '@rentable/desktop@*';

            execSync('git fetch --tags --force', { stdio: 'inherit' });

            const latestVersionTag = execSync(`git tag --list '${PACKAGE_TAG_GLOB}' --sort=-version:refname | head -n 1`, {
              encoding: 'utf8',
              shell: '/bin/bash',
            }).trim();

            if (!latestVersionTag) {
              core.info(`No tags matching ${PACKAGE_TAG_GLOB}. Skipping artifacts job.`);
              core.setOutput('should_publish', 'false');
              core.setOutput('release_tag', '');
              core.setOutput('release_version', '');
              core.setOutput('release_package', '');
              return;
            }

            // The tag is `<name>@<version>` and the split is on the *final* `@`, because the
            // package name is scoped and carries an `@` of its own — splitting on the first
            // one yields "rentable/desktop" as the version and names the release after it.
            //
            // Both halves are outputs, and the name half is read here rather than spelled in
            // the title below for the reason `changeset-tag.cjs` reads it rather than spelling
            // it: a release that names a package other than the one it was cut from is a
            // release nobody can trace back. It is also requirement 4 — a second publishable
            // package titles its own releases without an edit to this file.
            const separator = latestVersionTag.lastIndexOf('@');
            const releasePackage = latestVersionTag.slice(0, separator);
            const releaseVersion = latestVersionTag.slice(separator + 1);

            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });

            const releaseForLatestTag = releases.find((release) => release.tag_name === latestVersionTag);
            const latestArtifactTag = releaseForLatestTag?.tag_name ?? '';
            const shouldPublish = latestArtifactTag !== latestVersionTag;

            core.info(`Latest version tag: ${latestVersionTag}`);
            core.info(`Latest artifact tag: ${latestArtifactTag || '(none)'}`);
            core.info(`Release package: ${releasePackage}`);
            core.info(`Release version: ${releaseVersion}`);

            core.setOutput('should_publish', shouldPublish ? 'true' : 'false');
            core.setOutput('release_tag', latestVersionTag);
            core.setOutput('release_version', releaseVersion);
            core.setOutput('release_package', releasePackage);

  artifacts:
    needs: changesets
    if: needs.changesets.outputs.should_publish == 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            args: ''
          - platform: windows-latest
            args: ''
          - platform: macos-latest # for intel based macs
            args: '--target x86_64-apple-darwin'
          - platform: macos-latest # for arm based macs
            args: '--target aarch64-apple-darwin'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: '☁️ checkout repository'
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.changesets.outputs.release_tag }}

      - name: '🛠️ setup pnpm'
        uses: pnpm/action-setup@v6

      - name: '🔧 setup node'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: '🦀 install rust stable'
        uses: dtolnay/rust-toolchain@stable
        with:
          # those targets are only used on macos runners so it's in an `if` to slightly speed up windows and linux builds.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: '📦 install apt packages'
        if: matrix.platform == 'ubuntu-latest'
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        continue-on-error: true
        with:
          packages: ${{ env.APT_PACKAGES }}
          version: 4
          execute_install_scripts: true

      # The step above is an optimization, and it fails open: it has restored zero
      # packages while still reporting success, which surfaces minutes later as an
      # unresolvable `-lgtk-3` at link time rather than as a failed install. This step
      # is the guarantee — a no-op when the cache worked, an install when it did not.
      # An unrecognised module name here costs an unnecessary apt-get, never a skip.
      - name: '📦 ensure system libraries'
        if: matrix.platform == 'ubuntu-latest'
        run: |
          if pkg-config --exists gtk+-3.0 webkit2gtk-4.1; then
            echo 'system libraries already present'
            exit 0
          fi
          echo 'cache restored nothing usable — installing from apt'
          sudo apt-get update
          sudo apt-get install -y ${{ env.APT_PACKAGES }}

      - name: '📦 install pnpm packages'
        run: pnpm install --frozen-lockfile

      - name: '🚀 build and publish signed updater artifacts'
        uses: tauri-apps/tauri-action@v1.0.0
        with:
          tagName: ${{ needs.changesets.outputs.release_tag }}
          # The title names the package the release was cut from, so the releases page, the tag
          # and the changelog all name the same thing. Both halves come from the tag — nothing
          # here spells a package — and they are recomposed rather than used whole, because the
          # tag joins them with `@` and a title reading `@rentable/desktop@0.12.1` is a tag on a
          # page of titles. The five releases named `rentable v0.11.0` and so on keep those
          # names — this changes what is cut next, not what is published.
          releaseName: '${{ needs.changesets.outputs.release_package }} v${{ needs.changesets.outputs.release_version }}'
          generateReleaseNotes: true
          uploadUpdaterJson: true
          tauriScript: pnpm tauri
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
