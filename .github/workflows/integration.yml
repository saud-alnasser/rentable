name: '🔧 integration'

# `edited` is deliberately absent. It fires on a title or body change, it was here
# only to serve the conventional-commit check on the title, and that check now has
# its own workflow — see pull-request-title.yml.
on:
  pull_request:
    types: ['opened', 'reopened', 'synchronize']

# A pull request only ever needs an answer about its newest commit. Without this,
# pushing again while a run is in flight leaves both running, and the older one
# spends a full build reporting on a commit nobody will merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # The Linux system libraries the Rust side links against. Defined once because two
  # steps consume it — the cache and the apt-get that guarantees it — and a list that
  # drifts between them reintroduces exactly the failure they exist to prevent.
  APT_PACKAGES: >-
    pkg-config libgtk-3-dev libayatana-appindicator3-dev libsoup-3.0-dev
    libjavascriptcoregtk-4.1-dev libwebkit2gtk-4.1-dev librsvg2-dev
    libcairo2-dev libpango1.0-dev libharfbuzz-dev libatk1.0-dev
    libgdk-pixbuf-2.0-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
    gstreamer1.0-plugins-base gstreamer1.0-plugins-good patchelf
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # A compile input, not a bundler one: build.rs reads it and bakes it into the
  # binary through `cargo:rustc-env`, so a build without it produces a different
  # binary rather than a differently-packaged one. It is also public — the same
  # value is committed in tauri.conf.json. The signing keys that were here are
  # gone, because nothing in this workflow bundles any more.
  TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}

jobs:
  # The default-branch ruleset requires a status check with this exact name.
  # Renaming this job, or moving it off a trigger that fires for every commit,
  # makes every pull request unmergeable.
  integration:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - name: '☁️ checkout repository'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Merging one pull request of a stack rebases every branch above it, which
      # force-pushes each one and re-runs this whole gate on code that has not changed —
      # and the merge waits for every one of them. The rebase moves commits, not content:
      # a git tree is content-addressed, so a branch replayed onto a base holding the same
      # code produces a byte-identical tree and therefore an identical hash. That is what
      # is fingerprinted here.
      - name: '🔑 fingerprint the tree'
        id: fingerprint
        run: echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      # A hit means these exact bytes already passed this gate, so every step below is
      # skipped and the job reports green in seconds. `lookup-only` asks whether the entry
      # exists without downloading it — the entry is a marker, and its contents are never
      # read. The key carries a version so it can be invalidated by hand without waiting
      # for eviction.
      #
      # What a hit assumes is that identical sources produce an identical result. That is
      # not quite free — the npm registry, the Rust toolchain and a flaky test can all
      # move underneath it — and it is the same assumption a merge queue makes when it
      # fast-forwards. Anything genuinely landing on the base changes the tree, misses,
      # and gets the full run; that miss is what keeps the rest honest.
      - name: '🗃️ look for a pass on this exact tree'
        id: memo
        uses: actions/cache/restore@v6
        with:
          path: .integration-pass
          key: integration-pass-v1-${{ steps.fingerprint.outputs.tree }}
          lookup-only: true

      # A stack pays for this job once per branch, and almost all of that time is the Rust
      # side, which most branches never touch. This decides which of the steps below have
      # anything left to prove on the runs that are not memoized away. It reads the pull
      # request's own diff against its base rather than a commit range, so a branch rebased
      # onto a new base still classifies the same change the same way.
      #
      # It fails open: a diff that cannot be read runs everything, because the failure a
      # gate must never have is deciding it had nothing to check.
      - name: '🔍 classify the change'
        id: changed
        if: steps.memo.outputs.cache-hit != 'true'
        run: |
          if ! files=$(git diff --name-only '${{ github.event.pull_request.base.sha }}' HEAD); then
            echo 'the diff could not be read — running every step rather than guessing'
            echo 'rust=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "$files"

          # The workflows are here because a change to this file has to be proved on the
          # path it is changing, and the two manifests because the Rust build reaches
          # through them for the tauri CLI.
          if printf '%s\n' "$files" | grep -qE '^(tauri/|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|\.github/workflows/)'; then
            echo 'rust=true' >> "$GITHUB_OUTPUT"
          else
            echo 'rust=false' >> "$GITHUB_OUTPUT"
          fi

      - name: '🛠️ setup pnpm'
        if: steps.memo.outputs.cache-hit != 'true'
        uses: pnpm/action-setup@v6

      - name: '🔧 setup node'
        if: steps.memo.outputs.cache-hit != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      # The toolchain is part of the cache key, so this has to resolve to the same
      # thing warm-cache.yml resolves to or the restore misses. It previously
      # interpolated `matrix.toolchain` in a job that has no matrix, which expanded
      # to nothing — harmless on its own, but not something to reproduce in the
      # sibling workflow that now has to agree with it.
      - name: '🔼 update rust'
        if: steps.memo.outputs.cache-hit != 'true' && steps.changed.outputs.rust == 'true'
        run: rustup update && rustup default stable

      # `save-if: false` is the whole point of this being an action rather than a
      # hand-rolled cache: a pull request restores and never writes. GitHub scopes a
      # cache created during a pull request to that pull request alone, so the
      # entries written here were readable by nothing else while still consuming a
      # shared ten-gigabyte ceiling — sixteen of them held 12.2 GB, and the eviction
      # that followed is why this cache used to restore in one second. The entry
      # every pull request reads is written on main instead, by warm-cache.yml.
      # `shared-key` is what makes the two agree on a name; changing it here without
      # changing it there silently returns to a cold build.
      - name: '💿 cargo cache'
        if: steps.memo.outputs.cache-hit != 'true' && steps.changed.outputs.rust == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './tauri -> target'
          shared-key: 'integration'
          save-if: false

      # The system libraries exist for the Rust link step and nothing else — the
      # typecheck, the tests and the frontend build are pure Node. They are skipped
      # with the compile they serve.
      - name: '📦 install apt packages'
        if: steps.memo.outputs.cache-hit != 'true' && steps.changed.outputs.rust == 'true'
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        continue-on-error: true
        with:
          packages: ${{ env.APT_PACKAGES }}
          version: 4
          execute_install_scripts: true

      # The step above is an optimization, and it fails open: it has restored zero
      # packages while still reporting success, which surfaces minutes later as an
      # unresolvable `-lgtk-3` at link time rather than as a failed install. This step
      # is the guarantee — a no-op when the cache worked, an install when it did not.
      # An unrecognised module name here costs an unnecessary apt-get, never a skip.
      - name: '📦 ensure system libraries'
        if: steps.memo.outputs.cache-hit != 'true' && steps.changed.outputs.rust == 'true'
        run: |
          if pkg-config --exists gtk+-3.0 webkit2gtk-4.1; then
            echo 'system libraries already present'
            exit 0
          fi
          echo 'cache restored nothing usable — installing from apt'
          sudo apt-get update
          sudo apt-get install -y ${{ env.APT_PACKAGES }}

      # A generated index is never hand-edited, and this is what enforces it: the
      # regeneration overwrites every index, so anything git still reports afterwards —
      # a stale index, a hand edit, a drifted generator — fails the run, named. Needs
      # node and nothing from pnpm, so it sits before the install.
      - name: '🗺️ verify generated indexes'
        if: steps.memo.outputs.cache-hit != 'true'
        run: |
          node .aep/scripts/index.mjs > /dev/null
          stale=$(git status --porcelain -- .aep/index.md | cut -c4-)
          if [ -n "$stale" ]; then
            echo 'stale generated index — regenerate with: node .aep/scripts/index.mjs' >&2
            printf '%s\n' "$stale"
            exit 1
          fi
          node .aep/scripts/validate.mjs --quiet

      - name: '📦 install pnpm packages'
        if: steps.memo.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: '🔎 check'
        if: steps.memo.outputs.cache-hit != 'true'
        run: pnpm check

      # prettier already ran as part of `pnpm check`; this adds eslint only
      - name: '🧹 lint'
        if: steps.memo.outputs.cache-hit != 'true'
        run: pnpm exec eslint .

      - name: '🧪 test'
        if: steps.memo.outputs.cache-hit != 'true'
        run: pnpm test

      - name: '🦀 test rust'
        if: steps.memo.outputs.cache-hit != 'true' && steps.changed.outputs.rust == 'true'
        run: pnpm test:rust

      # `pnpm check` typechecks but never bundles, so without this step nothing
      # would prove the frontend still builds — it used to be proved as a side
      # effect of the bundler's beforeBuildCommand.
      - name: '🏗️ build frontend'
        if: steps.memo.outputs.cache-hit != 'true'
        run: pnpm build

      # The shell's breakpoint is declared once, in the stylesheet, and read from script at
      # runtime to decide which navigation presents. Unused-value elimination drops theme
      # entries nothing references, and this one is referenced from script rather than from a
      # utility — `@theme static` is what holds it in. A stylesheet shipped without it leaves
      # that read empty at the widths it was meant to decide, so the declaration is proved to
      # survive the bundler rather than assumed to.
      - name: '📐 verify the shell breakpoint survived the build'
        if: steps.memo.outputs.cache-hit != 'true'
        run: |
          if ! grep -rq -- '--breakpoint-shell:' build/_app/immutable/assets/; then
            echo 'the shell breakpoint is absent from the built stylesheet — check that src/app.css still declares it under `@theme static`' >&2
            exit 1
          fi

      # Compiles what the release build compiles, and stops there. Packaging the
      # installers and signing the updater artifacts is the release workflow's job,
      # and it does it on four platforms within minutes of merge; doing it here as
      # well cost six minutes a run to produce files that were never uploaded.
      #
      # What the skip gives up: this compile also embeds the frontend bundle, so a
      # frontend-only change no longer proves the binary still builds around it. That
      # is the same hole packaging already has — the release workflow is what catches
      # it, on `main`, within minutes of merge.
      - name: '🦀 build release binary'
        if: steps.memo.outputs.cache-hit != 'true' && steps.changed.outputs.rust == 'true'
        run: cargo build --release --manifest-path ./tauri/Cargo.toml

      # Only now is this tree known to have passed. `success()` is spelled out because
      # writing any `if` on a step replaces the implicit one, and the failure that would
      # cause — recording a pass for a tree whose tests just failed — is the one this
      # whole mechanism must never make. The marker's contents are never read; the key
      # is the entire claim.
      - name: '✅ mark this tree as passed'
        if: success() && steps.memo.outputs.cache-hit != 'true'
        run: |
          mkdir -p .integration-pass
          echo '${{ steps.fingerprint.outputs.tree }}' > .integration-pass/tree

      - name: '🗃️ record the pass'
        if: success() && steps.memo.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .integration-pass
          key: integration-pass-v1-${{ steps.fingerprint.outputs.tree }}
