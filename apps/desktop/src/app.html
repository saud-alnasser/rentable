<!doctype html>
<!--
	No appearance class here. `$lib/platform/appearance.ts` sets `dark` (or leaves it off) and
	`color-scheme` on this element before the window is shown, following the system unless the
	reader chose light or dark. The chart primitive's literal `.dark [data-chart=…]` rules select
	against that same class.
-->
<html lang="en" dir="ltr">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>rentable</title>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div>%sveltekit.body%</div>
	</body>
</html>
