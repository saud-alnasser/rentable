[package]
# `rentable-desktop` renders `@rentable/desktop` — the package this crate ships inside — in the
# character set cargo allows. It names the crate and nothing a user ever sees: the product is
# `tauri.conf.json`'s `productName`, still `rentable`, and the executable is the `[[bin]]` below.
name = "rentable-desktop"
version = "0.13.0"
description = "a rents payment tracker"
authors = ["saud-alnasser"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
# The binary keeps the product's name, and it is named here rather than left to cargo — which
# would derive it from the package above. Tauri bundles cargo's output binary as it finds it
# (`mainBinaryName` exists only to rename it afterwards), so a package name reaching this field
# would put `rentable-desktop.exe` inside every installer and change the executable an already
# installed copy is updated over. `path` is explicit because naming a target opts out of the
# discovery that would otherwise find `src/main.rs`.
name = "rentable"
path = "src/main.rs"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "rentable_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
tauri-plugin-opener = { version = "2.5.4" }
tauri-plugin-fs = { version = "2.5.1" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151" }
# writing the spreadsheet format the export menu offers beside csv. Chosen in Rust rather
# than as a webview library — see the effort's evidence, `where-the-spreadsheet-format-belongs`:
# the best-covered npm package has no patched release on the registry, and the reader the
# import direction needs is materially stronger here than anything on that side.
rust_xlsxwriter = { version = "0.98.2" }
# reading the same format back. The pair was chosen together in the effort's evidence,
# `where-the-spreadsheet-format-belongs` — reading is the heavier half and this is the
# strongest artifact in that comparison.
# `dates` is what turns a date cell back into a date rather than the count of days the
# format stores one as.
calamine = { version = "0.36.1", features = ["dates"] }
# choosing the file to import. Export answers where a file landed and never asks; import
# has to ask, and a path typed into the web layer is a path the web layer chose.
tauri-plugin-dialog = { version = "2.7.2" }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time"] }
# `sqlite-bundled` compiles SQLite into the binary, so there is no system library
# to depend on. No TLS feature is selected because nothing here speaks to a remote
# database — the TLS stack this crate does need is reqwest's, chosen below.
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "macros", "sqlite", "sqlite-bundled", "uuid", "chrono"] }
base64 = { version = "0.23.0" }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
dotenvy = { version = "0.15.7" }
sha2 = "0.11.0"
getrandom = { version = "0.4.3" }
url = { version = "2.5.8" }
# `rustls-no-provider` rather than `rustls`, which would pull aws-lc-rs in
# beside the ring provider the tree already builds through tauri-plugin-updater.
# Choosing no provider makes installing one this crate's job — `src/http.rs` —
# so rustls is named directly, with default features off for the same reason.
reqwest = { version = "0.13.4", default-features = false, features = ["json", "form", "rustls-no-provider"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std"] }
# `v1` is the all-in-one store manager: it picks the platform's own credential store —
# Keychain, Credential Manager, Secret Service — and pulls only that platform's backend,
# so this needs no per-target block. The alternative is naming `keyring-core` plus each
# store crate directly, which buys control this crate has no use for.
keyring = { version = "4.1.6", default-features = false, features = ["v1"] }
turso = { version = "0.8.0-pre.7", default-features = false, features = ["sync"] }
# the four below are the organization vault's key schedule and nothing else uses them.
# `src/organization/vault.rs` is where each one is called, and the module is pure functions
# over bytes, so none of them reaches a database, a socket, or the IPC boundary.
#
# turning a member's password into a key, which is the whole defence the vault has. There is
# no server to rate limit a guess, so cost per guess is the only thing between an attacker
# holding the ciphertext and the workspace, and Argon2id is the memory-hard function that
# sets it. `password-hash` is off: the salt and the cost live in their own columns, so the
# PHC string this crate would otherwise encode has nowhere to go and nothing to read it.
# `alloc` stays because it is what `hash_password_into` allocates its blocks with.
argon2 = { version = "0.6.0", default-features = false, features = ["alloc"] }
# sealing under a derived key. XChaCha20-Poly1305 takes a 24-byte nonce, which is wide enough
# to draw at random per seal without tracking a counter across machines that never meet. A
# vault is re-sealed on every password change, on whichever machine the member is sitting at,
# and no machine can see what another one drew. Its tag is also the whole of what a wrong
# password fails on. `getrandom` is off because nonces are drawn the way this crate already
# draws random bytes, through `getrandom::fill`.
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc"] }
# turning a Diffie-Hellman shared secret into a key. The raw output of x25519 is a curve point
# rather than a uniform key, and HKDF-SHA256 is what makes it one. The ephemeral and recipient
# public keys are bound in as `info`, so a sealed credential cannot be replayed at another
# member. It is also what mixes the invitation's two halves, neither of which travels
# with the other. `sha2` is already here and is the hash it runs over.
hkdf = "0.13.0"
# the keypair a credential is sealed to. An administrator grants a workspace to a member whose
# password they do not know, which is the property the whole design turns on and the reason
# this is asymmetric rather than a second symmetric seal. `static_secrets` is what allows the
# secret half to be held as bytes at all, which is what there is to seal; the default features
# are kept for `zeroize`, which scrubs that half when it drops.
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }

# the Drive transport is tested against a real HTTP server on loopback rather
# than a mocked transport, so header construction, retry, and error mapping are
# exercised on the wire. `hyper` and everything under it is already compiled
# here as reqwest's own stack; only `httpdate`, which hyper's server feature
# reads dates with, is new — and being a dev-dependency it is never linked into
# the shipped binary.
[dev-dependencies]
tokio = { version = "1.53.1", features = ["net"] }
hyper = { version = "1.11.0", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1.20", default-features = false, features = ["tokio"] }
http-body-util = { version = "0.1.4" }
bytes = { version = "1.12.1" }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2.10.0"

# Argon2id is memory-hard on purpose, and an unoptimized build of it is several times
# slower than the one that ships. Left alone, that difference lands in two places: a
# developer waits seconds at every sign-in against a debug build, and the test that
# proves the shipping cost is usable measures the build profile instead of the cost.
# So this one dependency is optimized in development as well, which changes nothing
# about the release binary and nothing about what the schedule computes.
[profile.dev.package.argon2]
opt-level = 3
